name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # Pinned so the runner image doesn't change under us (ubuntu-latest moves to Ubuntu 26 from 19 Oct 2026).
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CONDUIT_EMAIL: ${{ secrets.CONDUIT_EMAIL }}
      CONDUIT_PASSWORD: ${{ secrets.CONDUIT_PASSWORD }}

    steps:
      - name: Check required secrets
        run: |
          if [ -z "$CONDUIT_EMAIL" ] || [ -z "$CONDUIT_PASSWORD" ]; then
            echo "::error::Repository secrets CONDUIT_EMAIL and/or CONDUIT_PASSWORD are missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run API + UI tests
        run: npm test

      - name: Upload HTML report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
